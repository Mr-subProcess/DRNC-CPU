<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><style>.bg{fill:#fff}.box{fill:#f8fafc;stroke:#334155;stroke-width:3;rx:14}.c{fill:#ecfdf5;stroke:#047857;stroke-width:3;rx:12}.logic{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3;rx:12}.txt{font:24px Arial;fill:#0f172a}.small{font:19px Arial;fill:#334155}.title{font:bold 34px Arial;fill:#0f172a}.wire{stroke:#334155;stroke-width:4;fill:none}.feedback{stroke:#7c3aed;stroke-width:4;fill:none}</style></defs><rect class="bg" width="1400" height="760"/><text x="50" y="60" class="title">RAQM-03 — two-cell / two-bit symbol architecture</text>
<rect class="c" x="100" y="180" width="420" height="220"/><text x="310" y="225" text-anchor="middle" class="txt">B0 — bit cell 0</text><text x="310" y="275" text-anchor="middle" class="small">DATA0± / WE0±</text><text x="310" y="315" text-anchor="middle" class="small">OUT0± / VALID_B0</text><text x="310" y="360" text-anchor="middle" class="small">independent tail sense</text>
<rect class="c" x="880" y="180" width="420" height="220"/><text x="1090" y="225" text-anchor="middle" class="txt">B1 — bit cell 1</text><text x="1090" y="275" text-anchor="middle" class="small">DATA1± / WE1±</text><text x="1090" y="315" text-anchor="middle" class="small">OUT1± / VALID_B1</text><text x="1090" y="360" text-anchor="middle" class="small">independent tail sense</text>
<rect class="logic" x="520" y="485" width="360" height="140"/><text x="700" y="530" text-anchor="middle" class="txt">Muller C-element</text><text x="700" y="570" text-anchor="middle" class="small">PAIR_VALID + external ACK</text><text x="700" y="605" text-anchor="middle" class="small">only after both qualified</text>
<path class="wire" d="M310 400 L310 550 L520 550"/><path class="wire" d="M1090 400 L1090 550 L880 550"/>
<path class="feedback" d="M700 625 L700 690"/><text x="700" y="730" text-anchor="middle" class="small">Two-bit symbol: B1B0 ∈ {00, 01, 10, 11}</text>
<text x="55" y="120" class="small">No global clock. 4-phase handshake: REQ↑ → ACK↑ → REQ↓ → ACK↓.</text>
<text x="55" y="670" class="small">Physical integration HOLD until each single cell is simulated and bench-qualified.</text>
</svg>